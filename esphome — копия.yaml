external_components:
  - source: github://night-gnida/rapid-ac
    components: [rapid_ac]
    refresh: 0s

esphome:
  name: ir-remote-bluster
  friendly_name: ir remote bluster

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    id: ota_esphome_1

api:
  encryption:
    key: !secret ir_remote_bluster__encryption_key

web_server:
  port: 80

captive_portal: {}

logger:
  level: DEBUG

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

light:
  - platform: status_led
    name: "Status LED"
    pin:
      number: GPIO4
      inverted: true

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - lambda: |-
            auto call = id(ac_unit).make_call();
            call.set_mode(id(ac_unit).mode == climate::CLIMATE_MODE_OFF
                              ? climate::CLIMATE_MODE_COOL
                              : climate::CLIMATE_MODE_OFF);
            call.perform();

climate:
  - platform: rapid_ac
    id: ac_unit
    name: "Rapid AC"
    transmitter_id: ir_tx
    receiver_id: ir_rx

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO5
    inverted: false
  dump: all

remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO14
    inverted: false
  carrier_duty_percent: 50%