external_components:
  - source: components

esphome:
  name: rapid-ac
  platform: ESP8266
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

web_server:
  port: 80

captive_portal: {}

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

remote_transmitter:
  pin:
    number: GPIO14
    inverted: false
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO5
    inverted: false
  dump: raw

climate:
  - platform: rapid_ac
    name: "Rapid AC"
    transmitter_id: remote_transmitter
    receiver_id: remote_receiver
