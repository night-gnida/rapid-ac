external_components:
  - source: components

esphome:
  name: rapid-ac
  platform: ESP8266
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

web_server:
  port: 80

captive_portal: {}

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

remote_transmitter:
  pin:
    number: GPIO14
    inverted: false
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO5
    inverted: false
  dump: raw

climate:
  - platform: rapid_ac
    id: ac_unit
    name: "Rapid AC"
    transmitter_id: remote_transmitter
    receiver_id: remote_receiver

number:
  - platform: template
    name: "AC Timer"
    id: ac_timer
    min_value: 0
    max_value: 24
    step: 1
    initial_value: 0
    optimistic: false
    update_interval: 5s
    lambda: |-
      return id(ac_unit).get_timer_hours();
    set_action:
      - lambda: |-
          id(ac_unit).set_timer_hours((int) x);
