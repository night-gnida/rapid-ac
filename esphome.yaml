external_components:
  - source: components

esphome:
  name: rapid-ac
  platform: ESP8266
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

web_server:
  port: 80

captive_portal: {}

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

remote_transmitter:
  pin:
    number: GPIO14
    inverted: false
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO5
    inverted: false
  dump: raw

climate:
  - platform: rapid_ac
    id: ac_unit
    name: "Rapid AC"
    transmitter_id: remote_transmitter
    receiver_id: remote_receiver

number:
  - platform: template
    name: "AC Timer"
    id: ac_timer
    min_value: 0
    max_value: 24
    step: 1
    initial_value: 0
    optimistic: false
    update_interval: 5s
    lambda: |-
      return id(ac_unit).get_timer_hours();
    set_action:
      - lambda: |-
          id(ac_unit).set_timer_hours((int) x);
  - platform: template
    name: "Probe Cmd"
    id: probe_cmd
    min_value: 0
    max_value: 31
    step: 1
    initial_value: 6
    optimistic: true
  - platform: template
    name: "Probe R0"
    id: probe_r0
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    optimistic: true
  - platform: template
    name: "Probe R1 extra"
    id: probe_r1
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    optimistic: true

button:
  - platform: template
    name: "Probe Send"
    on_press:
      - lambda: |-
          id(ac_unit).send_probe((uint8_t) id(probe_cmd).state, (uint8_t) id(probe_r0).state,
                                  (uint8_t) id(probe_r1).state, 0x00, 0x00);
  - platform: template
    name: "Probe AirFlow (07, bit4 clear)"
    on_press:
      - lambda: |-
          id(ac_unit).send_probe(0x07, 0x00, 0x00, 0x10, 0x00);
  - platform: template
    name: "Probe AirFlow (07, bit4 set)"
    on_press:
      - lambda: |-
          id(ac_unit).send_probe(0x07, 0x00, 0x00, 0x00, 0x00);
